name: Redirect Multiple Folders to New Domain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Convert HTML files to redirects
        run: |
          NEW_DOMAIN="https://cpo4twe.azurewebsites.net"
          FOLDERS="marinda pix/video"
          
          for folder in $FOLDERS; do
            if [ -d "$folder" ]; then
              echo "Processing: $folder"
              find "$folder" -name "*.html" -type f | while read file; do
                target_url="$NEW_DOMAIN/$file"
                
                echo "<!DOCTYPE html>" > "$file"
                echo "<html lang=\"en\">" >> "$file"
                echo "<head>" >> "$file"
                echo "    <meta charset=\"utf-8\">" >> "$file"
                echo "    <link rel=\"canonical\" href=\"$target_url\">" >> "$file"
                echo "    <meta http-equiv=\"refresh\" content=\"0; url=$target_url\">" >> "$file"
                echo "    <title>Redirecting...</title>" >> "$file"
                echo "</head>" >> "$file"
                echo "<body>" >> "$file"
                echo "    <p>Redirecting to <a href=\"$target_url\">new location</a>...</p>" >> "$file"
                echo "</body>" >> "$file"
                echo "</html>" >> "$file"
                
                echo "Updated: $file"
              done
            fi
          done
      
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Redirect all HTML files to new domain"
          git push
