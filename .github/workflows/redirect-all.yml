name: Redirect Multiple Folders to New Domain

on:
  workflow_dispatch:  # ম্যানুয়ালি রান করার জন্য

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Convert HTML files to SEO-friendly redirects
        run: |
          # আপনার নতুন ডোমেইন (শেষে কোনো '/' দেবেন না)
          NEW_DOMAIN="https://cpo4twe.azurewebsites.net"
          
          # যেই ফোল্ডারগুলোর ভেতরের সব পোস্ট রিডাইরেক্ট করতে চান, সেগুলোর নাম এখানে স্পেস দিয়ে লিখুন
          # উদাহরণ: "nca pix/video another-folder"
          FOLDERS="marinda pix/video"
          
          for folder in $FOLDERS; do
            if [ -d "$folder" ]; then
              echo "Processing folder: $folder"
              # ফোল্ডারের ভেতরের সব .html ফাইল খুঁজে বের করে রিডাইরেক্ট কোড বসানো
              find "$folder" -name "*.html" -type f | while read file; do
                target_url="$NEW_DOMAIN/$file"
                
                cat > "$file" << EOF
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="canonical" href="$target_url">
    <meta http-equiv="refresh" content="0; url=$target_url">
    <title>Redirecting...</title>
</head>
<body>
    <p>Redirecting to <a href="$target_url">new location</a>...</p>
</body>
</html>
EOF
                echo "Updated: $file"
              done
            else
              echo "Folder not found: $folder"
            fi
          done
      
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "SEO Redirect: Update all HTML files in specified folders"
          git push
