name: Redirect All NCA Posts

on:
  workflow_dispatch:  # ম্যানুয়ালি রান করার জন্য

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Convert all HTML files to redirect
        run: |
          # ⚠️ এখানে আপনার নতুন ডোমেইন বসান
          NEW_DOMAIN="https://cpo4twe.azurewebsites.net/"
          
          # nca ফোল্ডারের সব HTML ফাইল খুঁজে রিডাইরেক্ট কোড বসানো
          find nca -name "*.html" -type f | while read file; do
            filename=$(basename "$file")
            target_url="$NEW_DOMAIN/pix/video/$filename"
            
            cat > "$file" << EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="utf-8">
              <link rel="canonical" href="$target_url">
              <meta http-equiv="refresh" content="0; url=$target_url">
              <title>Redirecting...</title>
          </head>
          <body>
              <p>Redirecting to <a href="$target_url">new location</a>...</p>
          </body>
          </html>
          EOF
            echo "Updated: $file"
          done
      
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Redirect all pix/video posts to new domain"
          git push
